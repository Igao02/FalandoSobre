services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_container
    hostname: sqlserver
    environment:
      SA_PASSWORD: "SqlServer123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "0.0.0.0:14333:1433"
    restart: unless-stopped
    networks:
      - sqlserver-network

  falandosobre.web:
    build:
      context: .
      dockerfile: FalandoSobre.Web/FalandoSobre.Web/Dockerfile
    container_name: webapp_container
    ports:
      - "7248:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=master;User Id=sa;Password=SqlServer123!;TrustServerCertificate=true;
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - sqlserver-network

networks:
  sqlserver-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
